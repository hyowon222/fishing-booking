openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: fishing
    description: Boat fishing reservation lookup operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /fishing/schedules:
    get:
      operationId: searchFishingSchedules
      tags: [fishing]
      summary: Search available boat fishing schedules
      description: Searches the configured public reservation source for sailings matching the requested filters.
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: region
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: port
          in: query
          required: false
          schema:
            type: string
        - name: ship
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - name: tide
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Matching schedules
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FishingScheduleSearchResponse"
        "400":
          description: Invalid search range or filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Reservation source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fishing/options:
    get:
      operationId: getFishingFilterOptions
      tags: [fishing]
      summary: Get available fishing filters
      description: Returns configured filter values immediately and refreshes discovered values in the background.
      responses:
        "200":
          description: Filter values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FishingFilterOptions"
        "502":
          description: Reservation source unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fishing/sources:
    get:
      operationId: listFishingSources
      tags: [fishing]
      summary: List configured fishing reservation sources
      responses:
        "200":
          description: Configured sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FishingSource"
    post:
      operationId: createFishingSource
      tags: [fishing]
      summary: Add a fishing reservation source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FishingSourceInput"
      responses:
        "201":
          description: Created source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FishingSource"
        "400":
          description: Invalid source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Source already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fishing/sources/{id}:
    patch:
      operationId: updateFishingSource
      tags: [fishing]
      summary: Update a fishing reservation source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FishingSourceInput"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FishingSource"
        "400":
          description: Invalid source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Source already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFishingSource
      tags: [fishing]
      summary: Delete a fishing reservation source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fishing/sources/{id}/vessels:
    post:
      operationId: addFishingSourceVessels
      tags: [fishing]
      summary: Add vessels to a fishing reservation source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FishingSourceVesselsInput"
      responses:
        "200":
          description: Updated source with vessels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FishingSource"
        "400":
          description: Invalid vessels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearFishingSourceVessels
      tags: [fishing]
      summary: Clear manually registered vessels for a source
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Cleared
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /fishing/sources/detect:
    post:
      operationId: detectFishingSource
      tags: [fishing]
      summary: Probe a URL to guess its reservation platform, name, and vessel list before registering it as a source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetectFishingSourceBody"
      responses:
        "200":
          description: Detection result (platform may be "unknown" if nothing recognizable was found)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetectFishingSourceResponse"
        "400":
          description: Invalid URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    FishingSchedule:
      type: object
      required:
        - id
        - departureDate
        - weekday
        - region
        - port
        - tide
        - tideStrengthPercent
        - genre
        - operator
        - vessel
        - remainingSeats
        - operatorUrl
        - bookingUrl
        - source
      properties:
        id:
          type: string
        departureDate:
          type: string
          format: date
        weekday:
          type: string
        region:
          type: string
        port:
          type: string
        tide:
          type: string
        tideStrengthPercent:
          description: 바다타임(badatime.com) 기준 조류 세기(%). 매핑되지 않은 항구이거나 조회에 실패하면 null.
          type: ["integer", "null"]
        genre:
          type: string
        operator:
          type: string
        vessel:
          type: string
        remainingSeats:
          type: ["integer", "null"]
        operatorUrl:
          type: ["string", "null"]
          format: uri
        bookingUrl:
          type: ["string", "null"]
          format: uri
        source:
          type: string
    FishingScheduleSearchResponse:
      type: object
      required:
        - items
        - total
        - searchedAt
        - source
        - cachedUntil
        - warning
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FishingSchedule"
        total:
          type: integer
        searchedAt:
          type: string
          format: date-time
        source:
          type: string
          description: URL for one source, or a label when multiple sources are configured
        cachedUntil:
          type: ["string", "null"]
          format: date-time
        warning:
          type: ["string", "null"]
        unavailableSources:
          type: array
          description: 이번 검색에서 끝내 불러오지 못한 예약처. 화면에서 직접 열어 볼 수 있는 링크로 보여 준다.
          items:
            $ref: "#/components/schemas/UnavailableSource"
    UnavailableSource:
      type: object
      required:
        - name
        - url
        - reason
      properties:
        name:
          type: string
        url:
          type: ["string", "null"]
          description: 직접 열어 볼 수 있는 예약처 주소. http/https 주소가 아니면 null.
        reason:
          type: string
          description: 불러오지 못한 이유를 줄인 한 줄 (예 - 연결 시간 초과 UND_ERR_CONNECT_TIMEOUT)
    FishingFilterOptions:
      type: object
      required:
        - regions
        - ports
        - ships
        - tides
        - shipsByPort
        - shipsByRegion
        - refreshing
      properties:
        regions:
          type: array
          items:
            type: string
        ports:
          type: array
          items:
            type: string
        ships:
          type: array
          items:
            type: string
        tides:
          type: array
          items:
            type: string
        shipsByPort:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        shipsByRegion:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        refreshing:
          type: boolean
          description: Whether discovered filter values are currently being refreshed.
    FishingSource:
      type: object
      required:
        - id
        - name
        - region
        - port
        - sourceUrl
        - enabled
        - createdAt
        - updatedAt
        - vessels
      properties:
        id:
          type: integer
        name:
          type: string
        region:
          type: string
        port:
          type: string
        sourceUrl:
          type: string
          format: uri
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        vessels:
          type: array
          items:
            $ref: "#/components/schemas/FishingSourceVessel"
    FishingSourceVessel:
      type: object
      required:
        - id
        - name
        - departurePort
        - address
      properties:
        id:
          type: integer
        name:
          type: string
        departurePort:
          type: string
        address:
          type: string
    FishingSourceVesselsInput:
      type: object
      required:
        - vessels
      properties:
        vessels:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/FishingSourceVesselInput"
    FishingSourceVesselInput:
      type: object
      required:
        - name
        - departurePort
        - address
      properties:
        name:
          type: string
          minLength: 1
        departurePort:
          type: string
        address:
          type: string
    DetectFishingSourceBody:
      type: object
      required:
        - url
      properties:
        url:
          type: string
    DetectFishingSourceResponse:
      type: object
      required:
        - platform
        - suggestedName
        - suggestedPort
        - suggestedRegion
        - vessels
        - workingUrl
      properties:
        platform:
          description: '"thefishing" | "sunsang24" | "unknown" 중 하나. 더피싱(index.php?mid=bk) 또는 SUNSANG24(/ship/schedule_fleet) 패턴 중 실제로 선박이 긁힌 쪽이고, 둘 다 안 되면 unknown.'
          type: string
        suggestedName:
          description: 사이트 <title> 태그에서 뽑아본 이름 추천값. 참고용이라 그대로 안 써도 됨.
          type: ["string", "null"]
        suggestedPort:
          description: 사이트 제목·본문·주소에서 기존 예약처에 등록된 항구 이름 하나만 확인된 경우의 항구 값.
          type: ["string", "null"]
        suggestedRegion:
          description: 확인된 항구로 등록된 기존 예약처의 지역 값. 항구가 불명확하거나 기존 지역 값이 일치하지 않으면 null.
          type: ["string", "null"]
        vessels:
          description: 이번 달(또는 비어있으면 다음 달) 조회에서 실제로 발견된 선박 이름들.
          type: array
          items:
            type: string
        workingUrl:
          description: 정상 인식된 경우의 기준 URL. platform이 unknown이면 null.
          type: ["string", "null"]
    FishingSourceInput:
      type: object
      required:
        - name
        - region
        - port
        - sourceUrl
      properties:
        name:
          type: string
          minLength: 1
        region:
          type: string
          minLength: 1
        port:
          type: string
          minLength: 1
        sourceUrl:
          type: string
          format: uri
        enabled:
          type: boolean
          default: true
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        detail:
          type: string
          description: 일정 조회가 실패한 원인 한 줄 (예 - 대야도 피싱아일랜드 - 연결 시간 초과). 검색 오류 화면에 "원인:"으로 보여 준다.
        unavailable:
          type: array
          description: 일정 조회가 모든 예약처에서 실패했을 때, 직접 열어 볼 수 있도록 알려 주는 예약처 목록.
          items:
            $ref: "#/components/schemas/UnavailableSource"

